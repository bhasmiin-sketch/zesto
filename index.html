<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Improved Food Ordering Website</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: auto; }
        .menu { display: flex; flex-wrap: wrap; }
        .menu-item { border: 1px solid #ccc; margin: 10px; padding: 10px; width: 30%; }
        .cart { border: 1px solid #000; padding: 10px; margin-top: 20px; }
        .cart-item { display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Food Ordering</h1>
        <div class="menu">
            <div class="menu-item" data-name="Pizza" data-price="10">
                <h2>Pizza</h2>
                <button onclick="addToCart(this)">Add to Cart</button>
            </div>
            <div class="menu-item" data-name="Burger" data-price="5">
                <h2>Burger</h2>
                <button onclick="addToCart(this)">Add to Cart</button>
            </div>
        </div>
        
        <div class="cart">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <button onclick="clearCart()">Clear Cart</button>
        </div>
    </div>

    <script>
        const cart = [];

        function addToCart(button) {
            const item = {
                name: button.parentElement.dataset.name,
                price: parseFloat(button.parentElement.dataset.price),
                quantity: 1
            };
            const existingItem = cart.find(i => i.name === item.name);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push(item);
            }
            updateCartDisplay();
        }

        function removeFromCart(name) {
            const index = cart.findIndex(item => item.name === name);
            if (index > -1) {
                cart.splice(index, 1);
                updateCartDisplay();
            }
        }

        function updateCartDisplay() {
            const cartItemsDiv = document.getElementById('cartItems');
            cartItemsDiv.innerHTML = '';
            cart.forEach(item => {
                cartItemsDiv.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name} (x${item.quantity}) - $${item.price * item.quantity}</span>
                        <button onclick="removeFromCart('${item.name}')">Remove</button>
                    </div>
                `;
            });
        }

        function clearCart() {
            cart.length = 0; // Clear the cart
            updateCartDisplay();
        }
    </script>
</body>
</html>
